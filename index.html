<style>
:root {

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0.75rem;margin:1rem 0 1.25rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0.9rem 1rem}
.kpi .l{color:var(--muted);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.04em}
.kpi .v{font-size:1.25rem;font-weight:600;margin-top:0.25rem}
.kpi .s{font-size:0.78rem;color:var(--muted);margin-top:0.2rem;word-break:break-word}
.filters{display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem;align-items:center}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:0.55rem 0.7rem;font:inherit;min-height:44px}
.filters input{flex:1;min-width:180px}
table{width:100%;border-collapse:collapse;font-size:0.92rem}
th,td{text-align:left;padding:0.65rem 0.5rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.04em}
tr:hover td{background:rgba(255,255,255,0.02)}
.badge{display:inline-block;padding:0.15rem 0.45rem;border-radius:6px;font-size:0.72rem;font-weight:600}
.badge.exact{background:rgba(61,154,106,0.2);color:var(--ok)}
.badge.equivalent,.badge.near_equiv{background:rgba(196,163,90,0.2);color:var(--warn)}
.badge.wrong_config{background:rgba(196,92,92,0.2);color:var(--bad)}
.stock-in_stock{color:var(--ok)} .stock-oos{color:var(--bad)} .stock-unknown{color:var(--muted)}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
.caveat{color:var(--muted);font-size:0.85rem;margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)}
.money{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
</style>

function money(n){return n==null?'—':'$'+Number(n).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtOffer(o){if(!o)return '—';return money(o.price_aud)+' · '+(o.retailer||'')+' · '+(o.title||'').slice(0,70)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))}
function renderKpis(){
  const k=DATA.kpi;
  const cards=[
    ['Offers', k.offers, ''],
    ['In stock', k.in_stock, ''],
    ['Cheapest exact (in stock)', money(k.cheapest_exact_in_stock&&k.cheapest_exact_in_stock.price_aud), fmtOffer(k.cheapest_exact_in_stock)],
    ['Cheapest Strix 128 exact', money(k.cheapest_strix_128_exact&&k.cheapest_strix_128_exact.price_aud), fmtOffer(k.cheapest_strix_128_exact)],
    ['Cheapest exact AU checkout', money(k.cheapest_exact_aud_checkout&&k.cheapest_exact_aud_checkout.price_aud), fmtOffer(k.cheapest_exact_aud_checkout)],
    ['Cheapest exact FX USD', money(k.cheapest_exact_fx_usd&&k.cheapest_exact_fx_usd.price_aud), fmtOffer(k.cheapest_exact_fx_usd)],
    ['Cheapest near-equiv (in stock)', money(k.cheapest_equiv_in_stock&&k.cheapest_equiv_in_stock.price_aud), fmtOffer(k.cheapest_equiv_in_stock)],
  ];
  document.getElementById('kpis').innerHTML=cards.map(([l,v,s])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||''}</div></div>`).join('');
  const cls=document.getElementById('cls');
  const classes=[...new Set(DATA.offers.map(o=>o.product_family||o.target_class).filter(Boolean))].sort();
  classes.forEach(c=>{const opt=document.createElement('option');opt.value=c;opt.textContent=c;cls.appendChild(opt)});
  document.getElementById('caveat').textContent =
    `Scraped ${k.scraped_awst||'—'} (AWST). ${k.fx_note||''} Aggregator hits should be verified on the retailer page. Wrong configs rejected. No prices invented.`;
}
function filtered(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const match=document.getElementById('match').value;
  const stock=document.getElementById('stock').value;
  const cls=document.getElementById('cls').value;
  const sort=document.getElementById('sort').value;
  let rows=DATA.offers.slice();
  if(match==='near_equiv') rows=rows.filter(o=>o.config_match==='near_equiv'||o.config_match==='equivalent');
  else if(match!=='all') rows=rows.filter(o=>o.config_match===match);
  if(stock!=='all') rows=rows.filter(o=>o.stock===stock);
  if(cls!=='all') rows=rows.filter(o=>(o.product_family||o.target_class)===cls);
  if(q) rows=rows.filter(o=>((o.title||'')+(o.retailer||'')+(o.match_notes||'')).toLowerCase().includes(q));
  rows.sort((a,b)=>{
    if(sort==='price_asc') return (a.price_aud??1e15)-(b.price_aud??1e15);
    if(sort==='price_desc') return (b.price_aud??0)-(a.price_aud??0);
    return String(a.retailer).localeCompare(String(b.retailer));
  });
  return rows;
}
function render(){
  const rows=filtered();
  document.getElementById('rows').innerHTML=rows.map(o=>`<tr>
    <td class="money">${money(o.price_aud)}${o.currency_original&&o.currency_original!=='AUD'?`<div style="font-size:0.75rem;color:var(--muted);font-weight:400">${o.currency_original} ${o.price_original??''}</div>`:''}</td>
    <td>${escapeHtml(o.title||'')}<div style="color:var(--muted);font-size:0.8rem">${escapeHtml(o.match_notes||'')}</div>
      ${o.ship_to_au_notes?`<div style="color:var(--muted);font-size:0.75rem">${escapeHtml(o.ship_to_au_notes)}</div>`:''}</td>
    <td><span class="badge ${o.config_match}">${o.config_match}</span></td>
    <td>${escapeHtml(o.product_family||o.target_class||'')}</td>
    <td>${escapeHtml(o.retailer||'')}</td>
    <td class="stock-${o.stock||'unknown'}">${o.stock||''}</td>
    <td>${o.url?`<a href="${o.url}" target="_blank" rel="noopener">Open</a>`:''}</td>
  </tr>`).join('') || '<tr><td colspan="7">No offers match filters.</td></tr>';
}
['q','match','stock','cls','sort'].forEach(id=>document.getElementById(id).addEventListener('input',render));
renderKpis(); render();
</script>
